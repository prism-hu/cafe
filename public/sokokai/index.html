<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>平田先生 壮行会</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* 会場の大型モニター全画面表示専用。夜空の紺に固定した単一テーマ */
  :root {
    --ink:        #f6f2e8;  /* 温かみのある生成りの白 */
    --ink-soft:   #cfd6e6;
    --ink-faint:  #8d98b5;
    --ground-0:   #0c1830;  /* 深紺（中心） */
    --ground-1:   #060d1d;  /* 深紺（外縁） */
    --blue:       #6aa6f0;
    --green:      #7bd1b0;
    --pink:       #f4a6c0;
    --gold:       #e8c87a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 50% 42%, var(--ground-0) 0%, var(--ground-1) 100%);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    display: grid;
    place-items: center;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; }

  .stage {
    position: relative;
    text-align: center;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 3.2vh, 34px);
  }

  .eyebrow {
    font-size: clamp(13px, 1.4vw, 22px);
    font-weight: 500;
    letter-spacing: .55em;
    text-indent: .55em; /* 均等割りの右端合わせ */
    color: var(--ink-faint);
  }

  .name {
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    font-weight: 800;
    font-size: clamp(44px, 8.5vw, 128px);
    line-height: 1.25;
    letter-spacing: .12em;
    text-wrap: balance;
    text-shadow: 0 0 60px rgba(106, 166, 240, .25);
  }
  .name small {
    display: block;
    font-size: .38em;
    font-weight: 600;
    letter-spacing: .3em;
    color: var(--ink-soft);
    margin-bottom: .5em;
  }

  .rule {
    width: clamp(140px, 22vw, 340px);
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--green) 50%, var(--pink));
    box-shadow: 0 0 24px rgba(123, 209, 176, .55);
  }

  .message {
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    font-weight: 600;
    font-size: clamp(20px, 2.6vw, 40px);
    line-height: 2.1;
    letter-spacing: .14em;
    color: var(--ink-soft);
    text-wrap: balance;
  }
  .message b {
    font-weight: 800;
    color: var(--ink);
    background: linear-gradient(90deg, var(--gold), #f6e3b0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(12px, 1.2vw, 19px);
    font-weight: 500;
    letter-spacing: .32em;
    text-indent: .32em;
    color: var(--ink-faint);
    margin-top: clamp(6px, 2vh, 20px);
  }
  .dots { display: inline-flex; gap: 7px; }
  .dots i { width: 9px; height: 9px; border-radius: 999px; }
  .dots i:nth-child(1) { background: var(--blue); }
  .dots i:nth-child(2) { background: var(--green); }
  .dots i:nth-child(3) { background: var(--pink); }

  /* 登場の順送りフェード */
  .stage > * { opacity: 0; transform: translateY(14px); animation: rise 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
  .stage > .eyebrow { animation-delay: .3s; }
  .stage > .name    { animation-delay: .9s; }
  .stage > .rule    { animation-delay: 1.9s; }
  .stage > .message { animation-delay: 2.5s; }
  .stage > .foot    { animation-delay: 3.4s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .stage > * { animation: none; opacity: 1; transform: none; }
    #sky { display: none; }
  }
  body.idle { cursor: none; }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<main class="stage">
  <p class="eyebrow">壮行会</p>
  <h1 class="name"><small>教授ご就任</small>平田先生<br>ご栄転おめでとうございます</h1>
  <div class="rule"></div>
  <p class="message">これまでのあたたかなご指導とお力添えに<br><b>心からの感謝</b>と、新天地でのご活躍への<br><b>大きな祝福</b>をこめて。</p>
  <p class="foot"><span class="dots"><i></i><i></i><i></i></span>PRISM-HU サイエンスカフェにて<span class="dots"><i></i><i></i><i></i></span></p>
</main>

<script>
(function () {
  // 3色＋金の光の粒がゆっくり舞い上がる。派手にしすぎず、会話の背景に沈む密度で
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('sky');
  if (!reduce && canvas) {
    var ctx = canvas.getContext('2d');
    var COLORS = ['#6aa6f0', '#7bd1b0', '#f4a6c0', '#e8c87a', '#e8c87a'];
    var parts = [];
    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    addEventListener('resize', resize);
    resize();
    function spawn(anywhere) {
      return {
        x: Math.random() * innerWidth,
        y: anywhere ? Math.random() * innerHeight : innerHeight + 12,
        r: 1.4 + Math.random() * 2.8,
        vy: 0.12 + Math.random() * 0.3,
        sway: 8 + Math.random() * 26,
        phase: Math.random() * Math.PI * 2,
        speed: 0.003 + Math.random() * 0.004,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: 0.25 + Math.random() * 0.5
      };
    }
    var COUNT = Math.min(90, Math.round(innerWidth / 18));
    for (var i = 0; i < COUNT; i++) parts.push(spawn(true));
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.y -= p.vy;
        p.phase += p.speed * 16;
        var x = p.x + Math.sin(p.phase) * p.sway;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        if (p.y < -14) parts[i] = spawn(false);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(tick);
    })();
  }

  // 3秒操作が無ければカーソルを隠す（全画面掲示のため）
  var idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['mousemove', 'keydown', 'click'].forEach(function (ev) { addEventListener(ev, wake); });
  wake();
})();
</script>

</body>
</html>
