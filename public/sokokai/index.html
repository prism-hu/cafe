<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>平田先生 壮行会</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Outfit:wght@300;400;500&display=swap">
<style>
  /* 会場の大型モニター全画面表示専用。夜空の紺に固定した単一テーマ */
  :root {
    --ink:        #f7f3ea;  /* 温かみのある生成りの白 */
    --ink-soft:   #cdd5e5;
    --ink-faint:  #808ca9;
    --ground-0:   #0c1830;  /* 深紺（中心） */
    --ground-1:   #060d1d;  /* 深紺（外縁） */
    --blue:       #6aa6f0;
    --green:      #7bd1b0;
    --pink:       #f4a6c0;
    --gold:       #e8c87a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 50% 42%, var(--ground-0) 0%, var(--ground-1) 100%);
    color: var(--ink);
    font-family: 'Outfit', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    display: grid;
    place-items: center;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; }

  .stage {
    position: relative;
    text-align: center;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.6vh, 28px);
  }

  .eyebrow {
    font-size: clamp(12px, 1.15vw, 19px);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .62em;
    text-indent: .62em;
    color: var(--ink-faint);
  }

  h1 { display: contents; }
  .congrats {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 350;
    font-variation-settings: 'opsz' 120;
    font-size: clamp(38px, 5.4vw, 88px);
    line-height: 1.1;
    letter-spacing: .01em;
    background: linear-gradient(92deg, var(--gold) 10%, #f7e7bb 55%, var(--gold) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 34px rgba(232, 200, 122, .22));
  }
  .name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 620;
    font-variation-settings: 'opsz' 144;
    font-size: clamp(56px, 9.6vw, 168px);
    line-height: 1.04;
    letter-spacing: .005em;
    text-wrap: balance;
    text-shadow: 0 0 70px rgba(106, 166, 240, .28);
  }

  .rule {
    width: clamp(140px, 22vw, 340px);
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--green) 50%, var(--pink));
    box-shadow: 0 0 24px rgba(123, 209, 176, .55);
    margin-top: clamp(6px, 1.6vh, 16px);
  }

  .message {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 340;
    font-variation-settings: 'opsz' 60;
    font-size: clamp(18px, 2.1vw, 34px);
    line-height: 1.8;
    letter-spacing: .015em;
    color: var(--ink-soft);
    text-wrap: balance;
    max-width: 34em;
  }

  .foot {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(11px, 1vw, 16px);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: .4em;
    text-indent: .4em;
    color: var(--ink-faint);
    margin-top: clamp(8px, 2.4vh, 24px);
  }
  .dots { display: inline-flex; gap: 7px; }
  .dots i { width: 8px; height: 8px; border-radius: 999px; }
  .dots i:nth-child(1) { background: var(--blue); }
  .dots i:nth-child(2) { background: var(--green); }
  .dots i:nth-child(3) { background: var(--pink); }

  /* 登場の順送りフェード */
  .stage > * { opacity: 0; transform: translateY(14px); animation: rise 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
  .stage > .eyebrow  { animation-delay: .3s; }
  .stage > .congrats { animation-delay: .9s; }
  .stage > .name     { animation-delay: 1.5s; }
  .stage > .rule     { animation-delay: 2.4s; }
  .stage > .message  { animation-delay: 3s; }
  .stage > .foot     { animation-delay: 3.9s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .stage > * { animation: none; opacity: 1; transform: none; }
    #sky { display: none; }
  }
  body.idle { cursor: none; }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<main class="stage">
  <p class="eyebrow">Send-off Celebration</p>
  <h1><span class="congrats">Congratulations,</span><span class="name">Professor Hirata</span></h1>
  <div class="rule"></div>
  <p class="message">With heartfelt thanks for your guidance and kindness&nbsp;—<br>and every good wish for the journey ahead.</p>
  <p class="foot"><span class="dots"><i></i><i></i><i></i></span>From all of us at PRISM-HU<span class="dots"><i></i><i></i><i></i></span></p>
</main>

<script>
(function () {
  // 3色＋金の光の粒がゆっくり舞い上がる。派手にしすぎず、会話の背景に沈む密度で
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('sky');
  if (!reduce && canvas) {
    var ctx = canvas.getContext('2d');
    var COLORS = ['#6aa6f0', '#7bd1b0', '#f4a6c0', '#e8c87a', '#e8c87a'];
    var parts = [];
    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    addEventListener('resize', resize);
    resize();
    function spawn(anywhere) {
      return {
        x: Math.random() * innerWidth,
        y: anywhere ? Math.random() * innerHeight : innerHeight + 12,
        r: 1.4 + Math.random() * 2.8,
        vy: 0.12 + Math.random() * 0.3,
        sway: 8 + Math.random() * 26,
        phase: Math.random() * Math.PI * 2,
        speed: 0.003 + Math.random() * 0.004,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        alpha: 0.25 + Math.random() * 0.5
      };
    }
    var COUNT = Math.min(90, Math.round(innerWidth / 18));
    for (var i = 0; i < COUNT; i++) parts.push(spawn(true));
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.y -= p.vy;
        p.phase += p.speed * 16;
        var x = p.x + Math.sin(p.phase) * p.sway;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 14;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        if (p.y < -14) parts[i] = spawn(false);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(tick);
    })();
  }

  // 3秒操作が無ければカーソルを隠す（全画面掲示のため）
  var idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  }
  ['mousemove', 'keydown', 'click'].forEach(function (ev) { addEventListener(ev, wake); });
  wake();
})();
</script>

</body>
</html>
