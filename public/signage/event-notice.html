<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イベント開催中 - サイエンスカフェ</title>
<!--
  ============================================================
  サイエンスカフェ ドア掲示（イベント開催中・入退室自由）
  - 用途: オープン開催（入退室自由）時にブラウザで全画面表示される。iframe で display.html から呼ばれる。
  - 完全自己完結: 外部CSS/JS/フォント/画像なし（QRはSVGを本ファイルに直接内包）。
  - QRの飛び先: https://cafe.prism-hu.org/
    URL変更時は README の手順で QR を生成し直す。
  - 終了時刻は載せない（毎回異なるため。表示の切替は display.html が自動で行う）。
  - 縦置きディスプレイ想定。単体で確認するときはブラウザで開き F11 で全画面。
  ============================================================
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    /* 歓迎の意を示す緑基調（貸切の紫と対比） */
    background: radial-gradient(120% 90% at 50% 0%, #1e8a5a 0%, #14694a 55%, #0e5039 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 6vh 6vw;
  }

  /* 上部: PRISM-HU ロゴ（濃色背景用 H_n_en。保護エリアの余白を確保し他要素を寄せない） */
  .logo-wrap { padding-top: 2vh; }
  .logo { height: 9vh; width: auto; display: block; }

  /* 中央: 主メッセージ */
  .main { display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  .venue {
    font-size: min(9vw, 6.5vh);
    font-weight: 800;
    letter-spacing: .06em;
    color: #f2ecff;
    margin-bottom: .4vh;
    white-space: nowrap;
  }
  .headline {
    font-size: min(15vw, 12vh);
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: .04em;
    text-shadow: 0 0.4vh 2vh rgba(0,0,0,.28);
    white-space: nowrap;
  }
  .headline-en {
    font-size: min(6.2vw, 4.6vh);
    font-weight: 700;
    letter-spacing: .06em;
    color: #d9ccff;
  }
  .rule { width: 22vw; max-width: 40vh; height: .5vh; border-radius: 999px;
    background: linear-gradient(90deg, #8fb8f5, #8fe0c1, #f6b9d0); margin: 1vh 0; }
  .sub {
    font-size: min(6.8vw, 5vh);
    font-weight: 800;
    line-height: 1.35;
    white-space: nowrap;
  }
  .sub-en {
    font-size: min(4.6vw, 3.4vh);
    font-weight: 600;
    letter-spacing: .04em;
    color: #cdbdf5;
    margin-top: .6vh;
  }

  /* 下部: QR案内カード */
  .guide {
    background: #fff;
    color: #331f5e;
    border-radius: 2.4vh;
    padding: 3vh 4vw;
    margin-top: 4vh;   /* 「Please do not enter」と十分に間隔をとる */
    display: flex;
    align-items: center;
    gap: 3.2vw;
    box-shadow: 0 1.4vh 4vh rgba(0,0,0,.3);
    max-width: 88vw;
  }
  .guide .qr {
    /* 白背景の上に濃紫でQR。crispEdgesでモジュール境界をくっきり。 */
    width: 15vh; height: 15vh; flex: none; display: block;
    shape-rendering: crispEdges;
  }
  .guide-text { text-align: left; }
  /* 改行位置は <br> で明示し、意図しない位置での折り返し（「ル、」だけ次行に
     こぼれる等）を nowrap で禁止する。フォントサイズはカード内幅に対して
     十分な余裕を見て決める（4K縦 2160px 時: テキスト幅 約1080px）。 */
  .guide-title { font-size: 2.2vh; font-weight: 800; line-height: 1.35; white-space: nowrap; }
  .guide-title-en { font-size: 1.6vh; font-weight: 600; color: #6b5a9e; margin-top: .4vh;
    line-height: 1.4; white-space: nowrap; }
  .guide-url { font-size: 1.6vh; color: #7a6aa8; margin-top: 1.2vh; word-break: break-all; }

  /* 横長ディスプレイに置かれた場合の保険（本来は縦置き想定） */
  @media (orientation: landscape) {
    .headline { font-size: min(13vh, 12vw); }
    .guide { flex-direction: row; }
  }
</style>
</head>
