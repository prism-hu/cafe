name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # サイネージのスライド一覧をファイル名から機械生成する（静的ホスティングは
      # ディレクトリ一覧を返せないため）。情報源はあくまで slides/ のファイル名で、
      # manifest.json を人が編集することはない（repo では gitignore、ここでのみ生成）
      - name: Generate slides manifest
        run: |
          cd public/signage/slides
          ls -1 | jq -R -s 'split("\n") | map(select(. != "" and . != "manifest.json")) | {files: .}' > manifest.json
          cat manifest.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=prism-cafe --branch=master

      # 削除したファイルがエッジキャッシュに残り続けるため（アセットは
      # cache-control: max-age=14400 ＝ 4 時間）、デプロイのたびにパージする。
      # 上書きは反映されるが削除は反映されず、終わったイベントのポスターが
      # サイネージに流れ続ける事故が実際に起きた（2026-08-04）。
      - name: Purge Cloudflare cache
        env:
          PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$ZONE_ID" ] || [ -z "$PURGE_TOKEN" ]; then
            echo "::error::キャッシュをパージできません。environment 'production' に CLOUDFLARE_ZONE_ID（と Zone > Cache Purge 権限を持つ CLOUDFLARE_PURGE_TOKEN）を設定してください。デプロイ自体は完了しています。"
            exit 1
          fi

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if ! echo "$response" | jq -e '.success == true' > /dev/null; then
            echo "::error::キャッシュのパージに失敗しました。削除したファイルは最大 4 時間配信され続けます。Cloudflare ダッシュボード（Caching > Configuration > Purge Everything）で手動パージしてください。"
            echo "$response" | jq -r '.errors // .' >&2
            exit 1
          fi

          echo "キャッシュをパージしました。"
